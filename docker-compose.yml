services:
  scheduler:
    build: ./scheduler
    container_name: maxmin_scheduler
    ports:
      - "5000:5000"
    volumes:
      - ./infrastructure:/app/infrastructure:ro
      - ./datasets:/app/dataset:ro
      - ./scheduler/app.py:/app/app.py:ro
      - ./scheduler/templates:/app/templates:ro
      - scheduler-data:/app/data
    environment:
      DATABASE_PATH: "/app/data/experiments.db"
      INVENTORY_PATH: "/app/infrastructure/inventory.json"
      DATASET_PATH: "/app/dataset/tasks.json"
      WORKERS: '[{"id":"WORKER-01","url":"http://worker1:8000","capacity":1.0,"host":"HOST-01","vm":"VM-01"},{"id":"WORKER-02","url":"http://worker2:8000","capacity":1.5,"host":"HOST-01","vm":"VM-02"},{"id":"WORKER-03","url":"http://worker3:8000","capacity":0.8,"host":"HOST-02","vm":"VM-03"},{"id":"WORKER-04","url":"http://worker4:8000","capacity":1.2,"host":"HOST-02","vm":"VM-04"}]'
    depends_on:
      worker1:
        condition: service_healthy
      worker2:
        condition: service_healthy
      worker3:
        condition: service_healthy
      worker4:
        condition: service_healthy
    networks:
      - maxmin-net

  worker1:
    build: ./worker
    container_name: maxmin_worker1
    environment:
      WORKER_ID: WORKER-01
      HOST_ID: HOST-01
      CAPACITY: "1.0"
      ITERATIONS_PER_UNIT: "80000"
    networks: [maxmin-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker2:
    build: ./worker
    container_name: maxmin_worker2
    environment:
      WORKER_ID: WORKER-02
      HOST_ID: HOST-01
      CAPACITY: "1.5"
      ITERATIONS_PER_UNIT: "80000"
    networks: [maxmin-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker3:
    build: ./worker
    container_name: maxmin_worker3
    environment:
      WORKER_ID: WORKER-03
      HOST_ID: HOST-02
      CAPACITY: "0.8"
      ITERATIONS_PER_UNIT: "80000"
    networks: [maxmin-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker4:
    build: ./worker
    container_name: maxmin_worker4
    environment:
      WORKER_ID: WORKER-04
      HOST_ID: HOST-02
      CAPACITY: "1.2"
      ITERATIONS_PER_UNIT: "80000"
    networks: [maxmin-net]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scheduler-data:

networks:
  maxmin-net:
    driver: bridge